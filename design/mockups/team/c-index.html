<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team C: index</title>
<link rel="stylesheet" href="shared.css">
<style>

.index { border-top: 1px solid var(--border); }
.row { border-bottom: 1px solid var(--border); }
.row > button { display: grid; grid-template-columns: 2fr 1.5fr 3fr auto; gap: 24px; align-items: baseline; width: 100%; padding: 20px 4px; border: 0; background: none; text-align: left; cursor: pointer; }
.row > button:hover { background: var(--surface); }
.row .name { font-size: 1.375rem; }
.row__latest { font-size: var(--fs-excerpt); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row__count { font-size: var(--fs-meta); color: var(--dim); font-variant-numeric: tabular-nums; }
.row__more { display: none; grid-template-columns: 200px 3fr 2fr; gap: 32px; padding: 8px 4px 32px; }
.row.is-open .row__more { display: grid; }
.row__more .photo { aspect-ratio: 1; border-radius: var(--radius); }
.row__more > div { display: flex; flex-direction: column; gap: 12px; }
.preview { position: fixed; width: 200px; aspect-ratio: 3 / 4; border-radius: var(--radius); overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 150ms; z-index: 40; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
.preview .photo { width: 100%; height: 100%; }
.preview.is-on { opacity: 1; }
@media (max-width: 800px) {
  .row > button { grid-template-columns: 1fr auto; gap: 4px 16px; }
  .row__latest { grid-column: 1 / -1; }
  .row__more { grid-template-columns: 1fr; }
  .row__more .photo { max-width: 200px; }
  .preview { display: none; }
}

</style>
</head>
<body>
<div class="bar"><a href="index.html">&larr; Team directions</a><span>C · Index list</span><span>Photo follows the cursor; click a row to expand</span><span class="sp"></span><button id="tw-theme" type="button" aria-pressed="false">Dark</button><button id="tw-photos" type="button" aria-pressed="false">No photos</button></div>
<main class="page"><header class="hero"><h1 class="hero__title">Our People</h1><p class="hero__intro">The people behind the work.</p></header>
<div class="index" id="index"></div></main>
<div class="preview" id="preview"></div>
<script src="data.js"></script>
<script>
initBar();

var list = document.getElementById('index'), preview = document.getElementById('preview');
TEAM.forEach(function (p) {
  var row = document.createElement('div'); row.className = 'row';
  row.innerHTML = '<button type="button" aria-expanded="false"><span class="name">' + p.name + '</span><span class="role">' + p.role + '</span>' +
    '<span class="row__latest">' + (p.posts[0] ? 'Latest: ' + p.posts[0][0] : '') + '</span><span class="row__count">' + p.count + ' post' + (p.count === 1 ? '' : 's') + '</span></button>' +
    '<div class="row__more">' + photoHTML(p) + '<div><p class="bio">' + p.bio + '</p><a class="linkedin" href="#">LinkedIn \u2197</a></div><div><p class="label">Latest</p>' + postsHTML(p) + '</div></div>';
  var btn = row.querySelector('button');
  btn.addEventListener('click', function () { var o = row.classList.toggle('is-open'); btn.setAttribute('aria-expanded', String(o)); preview.classList.remove('is-on'); });
  btn.addEventListener('mouseenter', function () { if (row.classList.contains('is-open') || document.body.classList.contains('no-photos')) return; preview.innerHTML = photoHTML(p); preview.classList.add('is-on'); });
  btn.addEventListener('mouseleave', function () { preview.classList.remove('is-on'); });
  btn.addEventListener('mousemove', function (e) { preview.style.left = (e.clientX + 24) + 'px'; preview.style.top = (e.clientY - 120) + 'px'; });
  list.appendChild(row);
});

</script>
</body>
</html>
