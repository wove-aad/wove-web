<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team D: flip cards</title>
<link rel="stylesheet" href="shared.css">
<style>

.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 800px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px)  { .grid { grid-template-columns: 1fr; } }
.flip { position: relative; aspect-ratio: 3 / 4; perspective: 1400px; }
.flip__inner { position: absolute; inset: 0; transition: transform 500ms cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
.flip.is-flipped .flip__inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--surface); }
.face--front { display: flex; flex-direction: column; width: 100%; padding: 0; text-align: left; cursor: pointer; }
.face--front .photo { flex: 1; }
.face--front .sum { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px 16px; }
.face--front .hint { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: var(--pill); background: var(--surface); font-size: var(--fs-tag); color: var(--muted); opacity: 0; transition: opacity var(--t); }
.flip:hover .hint { opacity: 1; }
.face--back { transform: rotateY(180deg); display: flex; flex-direction: column; gap: 12px; padding: 20px; overflow-y: auto; }
.face--back .bio { font-size: var(--fs-excerpt); }
.back-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.back-close { border: 0; background: none; cursor: pointer; font-size: 18px; color: var(--dim); padding: 0; line-height: 1; }
@media (prefers-reduced-motion: reduce) { .flip__inner { transition: none; } }

</style>
</head>
<body>
<div class="bar"><a href="index.html">&larr; Team directions</a><span>D · Flip in place</span><span>The card turns over to show bio and posts</span><span class="sp"></span><button id="tw-theme" type="button" aria-pressed="false">Dark</button><button id="tw-photos" type="button" aria-pressed="false">No photos</button></div>
<main class="page"><header class="hero"><h1 class="hero__title">Our People</h1><p class="hero__intro">The people behind the work.</p></header>
<div class="grid" id="grid"></div></main>
<script src="data.js"></script>
<script>
initBar();

var grid = document.getElementById('grid');
TEAM.forEach(function (p) {
  var el = document.createElement('div'); el.className = 'flip';
  el.innerHTML = '<div class="flip__inner"><button type="button" class="face face--front" aria-expanded="false">' + photoHTML(p) +
    '<span class="sum"><span class="name">' + p.name + '</span><span class="role">' + p.role + '</span></span><span class="hint">About ' + p.name.split(' ')[0] + '</span></button>' +
    '<div class="face face--back"><div class="back-head"><div><p class="name">' + p.name + '</p><p class="role">' + p.role + '</p></div><button class="back-close" type="button" aria-label="Back">\u00d7</button></div>' +
    '<p class="bio">' + p.bio + '</p><a class="linkedin" href="#">LinkedIn \u2197</a><p class="label">Latest</p>' + postsHTML(p) + '</div></div>';
  var front = el.querySelector('.face--front');
  front.addEventListener('click', function () { grid.querySelectorAll('.is-flipped').forEach(function (f) { f.classList.remove('is-flipped'); }); el.classList.add('is-flipped'); front.setAttribute('aria-expanded', 'true'); el.querySelector('.back-close').focus(); });
  el.querySelector('.back-close').addEventListener('click', function () { el.classList.remove('is-flipped'); front.setAttribute('aria-expanded', 'false'); front.focus(); });
  grid.appendChild(el);
});

</script>
</body>
</html>
