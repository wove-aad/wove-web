<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homepage feed: even grid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#ffffff;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#1535A8}
button{font:inherit;cursor:pointer}
.card .media-inner{transition:transform 500ms cubic-bezier(.2,.7,.2,1)}
.card:hover .media-inner{transform:scale(1.04)}
.card .reveal{opacity:0;transform:translateY(6px);transition:opacity 200ms,transform 200ms}
.card:hover .reveal,.card:focus-visible .reveal{opacity:1;transform:none}
.card:hover .card-title{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.card:focus-visible,.mini:focus-visible{outline:2px solid #2A50F3;outline-offset:6px}
.mini:hover .mini-text{text-decoration:underline;text-underline-offset:3px}
.chip:hover{border-color:#111111}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</helmet>
<div style="width: 1280px; height: 1800px; box-sizing: border-box; padding: 64px; background: #ffffff; display: flex; flex-direction: column; gap: 40px">
<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6B67">Work and thinking</div>
<h2 style="margin: 0; font-size: 48px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02">[Homepage feed heading]</h2>
</div>
<a href="#" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 5px">See all work
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a>
</header>
<nav aria-label="Filter by service" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="5">
<button class="chip" onClick="{{chip.pick}}" aria-pressed="{{chip.pressed}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid {{chip.border}}; background: {{chip.bg}}; color: {{chip.fg}}; font-size: 14px; font-weight: 500">
<span>{{chip.label}}</span>
<span style="font-size: 12px; opacity: 0.7">{{chip.count}}</span>
</button>
</sc-for>
</nav>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px 32px; align-items: start">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="8">

<sc-if value="{{c.isCase}}" hint-placeholder-val="{{c.isCase}}">
<a href="#" class="card" style="display: flex; flex-direction: column; gap: 14px; text-decoration: none; color: #111111">
<div style="position: relative; aspect-ratio: 4 / 3; border-radius: {{radius}}px; overflow: hidden; background: #22221B">
<div class="media-inner" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #22221B; color: #D8D4C6; font-size: 13px; font-weight: 500">[Case study image]</div>
<span style="position: absolute; top: 16px; left: 16px; padding: 6px 12px; background: #ffffff; border-radius: 999px; font-size: 12px; font-weight: 600; color: #111111">Case study</span>
<span class="reveal" style="position: absolute; right: 16px; bottom: 16px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: #ffffff; color: #111111; border-radius: 999px; font-size: 13px; font-weight: 600">See the work
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</span>
</div>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6B67">{{c.client}}</span>
<h3 class="card-title" style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.22; letter-spacing: -0.02em">{{c.title}}</h3>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{c.svc}}" as="s" hint-placeholder-count="2">
<span style="padding: 4px 10px; border: 1px solid #D9D6CC; border-radius: 999px; font-size: 12px; color: #3D3D3B">{{s}}</span>
</sc-for>
</div>
</a>
</sc-if>

<sc-if value="{{c.isMind}}" hint-placeholder-val="{{c.isMind}}">
<a href="#" class="card" style="display: flex; flex-direction: column; gap: 14px; text-decoration: none; color: #111111">
<div style="position: relative; aspect-ratio: 4 / 3; border-radius: {{radius}}px; overflow: hidden; background: {{c.tint}}">
<div class="media-inner" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: {{c.tint}}; color: {{c.ink}}; font-size: 13px; font-weight: 500">[Cover image]</div>
<span style="position: absolute; top: 16px; left: 16px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: #ffffff; border-radius: 999px; font-size: 12px; font-weight: 600; color: #111111">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.dot}}"></span>{{c.fname}}</span>
<span class="reveal" style="position: absolute; right: 16px; bottom: 16px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: #111111; color: #ffffff; border-radius: 999px; font-size: 13px; font-weight: 600">Read
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</span>
</div>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6B67">Wove Mind · {{c.svcText}}</span>
<h3 class="card-title" style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.22; letter-spacing: -0.02em">{{c.title}}</h3>
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #6B6B67">
<span style="width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: {{c.tint}}; color: {{c.ink}}; font-size: 10px; font-weight: 700">{{c.ini}}</span>
<span style="color: #3D3D3B; font-weight: 500">{{c.author}}</span>
<span>·</span>
<span>{{c.meta}}</span>
</div>
</a>
</sc-if>

<sc-if value="{{c.isStack}}" hint-placeholder-val="{{c.isStack}}">
<section aria-label="Short thoughts" style="box-sizing: border-box; padding: 24px; border-radius: {{radius}}px; background: #F5F5F2; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6B67">Short thoughts</span>
<a href="#" style="font-size: 13px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">All</a>
</div>
<sc-for list="{{c.minis}}" as="m" hint-placeholder-count="3">
<a href="#" class="mini" style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-top: 1px solid #D9D6CC; text-decoration: none; color: #111111">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #6B6B67"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{m.dot}}"></span>{{m.fname}} · {{m.author}}</span>
<span class="mini-text" style="font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em">{{m.title}}</span>
</a>
</sc-for>
</section>
</sc-if>

</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"shortForms":{"editor":"enum","options":["condense","hide"],"default":"condense"},"radius":{"editor":"range","default":12,"min":0,"max":32,"step":2,"unit":"px"},"$preview":{"width":1280,"height":1800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { svc: "All" };
  }
  renderVals() {
    const F = {
      spark: { name: "Spark", dot: "#C6841E", tint: "#F7ECD3", ink: "#7A4D0E" },
      thread: { name: "Thread", dot: "#2F7A57", tint: "#E1EEE7", ink: "#1A4D33" },
      whatif: { name: "What if", dot: "#2A50F3", tint: "#EBF0FE", ink: "#1535A8" },
      longread: { name: "Long read", dot: "#6B3EC2", tint: "#EDE6F8", ink: "#4A2A8A" }
    };
    const MAIN = [
      { k: "case", title: "[Case study title]", client: "[Client A]", svc: ["Strategy", "Brand"] },
      { k: "longread", title: "The quiet economics of care work", author: "Scott", ini: "SC", meta: "9 min read", svc: ["Strategy"] },
      { k: "whatif", title: "What if brand was a verb, not a noun?", author: "Grace", ini: "GM", meta: "312 reads", svc: ["Brand"] },
      { k: "case", title: "[Case study title]", client: "[Client B]", svc: ["Digital"] },
      { k: "longread", title: "Why we stopped pitching against agencies", author: "Scott", ini: "SC", meta: "8 min read", svc: ["Strategy"] },
      { k: "case", title: "[Case study title]", client: "[Client C]", svc: ["Labs", "Strategy"] },
      { k: "whatif", title: "What if we designed for rest?", author: "Grace", ini: "GM", meta: "420 reads", svc: ["Labs"] }
    ];
    const SHORT = [
      { k: "thread", title: "Three things clients keep asking that they don't need", author: "Zara", svc: ["Strategy"] },
      { k: "spark", title: "Spent an hour just watching how people cross the street here. It's a language.", author: "Zara", svc: ["Digital"] },
      { k: "thread", title: "Notes from a week of no meetings", author: "Scott", svc: ["Labs"] }
    ];
    const svc = this.state.svc;
    const condense = (this.props.shortForms ?? "condense") === "condense";
    const match = (e) => svc === "All" || e.svc.includes(svc);
    const all = condense ? MAIN.concat(SHORT) : MAIN;
    const chips = ["All", "Strategy", "Labs", "Digital", "Brand"].map((s) => {
      const on = svc === s;
      return {
        label: s,
        count: all.filter((e) => s === "All" || e.svc.includes(s)).length,
        pressed: on ? "true" : "false",
        bg: on ? "#111111" : "#ffffff",
        fg: on ? "#ffffff" : "#3D3D3B",
        border: on ? "#111111" : "#D9D6CC",
        pick: () => this.setState({ svc: s })
      };
    });
    const cells = MAIN.filter(match).map((e) => e.k === "case"
      ? { ...e, isCase: true }
      : { ...e, isMind: true, fname: F[e.k].name, dot: F[e.k].dot, tint: F[e.k].tint, ink: F[e.k].ink, svcText: e.svc.join(", ") });
    const minis = SHORT.filter(match).map((e) => ({ ...e, fname: F[e.k].name, dot: F[e.k].dot }));
    if (condense && minis.length) {
      cells.splice(Math.min(4, cells.length), 0, { isStack: true, minis });
    }
    return { chips, cells, radius: this.props.radius ?? 12 };
  }
}
</script>
</body>
</html>
