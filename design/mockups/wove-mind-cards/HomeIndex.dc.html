<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homepage feed: index with preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#ffffff;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#111111}
.row{transition:color 200ms,padding-left 250ms cubic-bezier(.2,.7,.2,1)}
.row:focus-visible{outline:2px solid #2A50F3;outline-offset:4px}
.row .arrow{transition:opacity 200ms}
.preview{transition:background 300ms}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</helmet>
<div style="width: 1280px; height: 1480px; box-sizing: border-box; padding: 64px; background: #ffffff; display: flex; flex-direction: column; gap: 48px">
<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6B67">Work and thinking</div>
<h2 style="margin: 0; font-size: 48px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02">[Homepage feed heading]</h2>
</div>
<a href="#" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 5px">See all work
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a>
</header>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 64px; align-items: start">
<div style="display: flex; flex-direction: column">
<div style="display: flex; flex-direction: column; border-bottom: 1px solid #EAEAE4">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<a href="#" class="row" onMouseEnter="{{r.hover}}" onFocus="{{r.hover}}" style="display: flex; align-items: center; gap: 24px; padding: 22px 0 22px {{r.indent}}px; border-top: 1px solid #EAEAE4; text-decoration: none; color: {{r.color}}">
<div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 0">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #6B6B67">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span>{{r.kind}} · {{r.who}} · {{r.svcText}}</span>
<span style="font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -0.025em">{{r.title}}</span>
</div>
<svg class="arrow" style="opacity: {{r.arrow}}; flex-shrink: 0" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>
<sc-if value="{{condense}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; padding-top: 40px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6B67; padding-bottom: 12px">Short thoughts</span>
<sc-for list="{{shorts}}" as="r" hint-placeholder-count="3">
<a href="#" class="row" onMouseEnter="{{r.hover}}" onFocus="{{r.hover}}" style="display: flex; align-items: baseline; gap: 16px; min-height: 44px; padding: 12px 0 12px {{r.indent}}px; border-top: 1px solid #EAEAE4; text-decoration: none; color: {{r.color}}">
<span style="display: inline-flex; align-items: center; gap: 8px; width: 96px; flex-shrink: 0; font-size: 12px; font-weight: 600; color: #6B6B67"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span>{{r.kind}}</span>
<span style="flex-grow: 1; min-width: 0; font-size: 17px; font-weight: 600; line-height: 1.35">{{r.title}}</span>
<span style="flex-shrink: 0; font-size: 13px; color: #6B6B67">{{r.who}}</span>
</a>
</sc-for>
</div>
</sc-if>
</div>
<aside aria-label="Preview" style="display: flex; flex-direction: column; gap: 20px">
<div class="preview" style="position: relative; aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; background: {{a.tint}}">
<sc-if value="{{a.cover}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: {{a.ink}}; font-size: 13px; font-weight: 500">{{a.placeholder}}</div>
</sc-if>
<sc-if value="{{a.quote}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; box-sizing: border-box; padding: 36px; display: flex; align-items: flex-end; font-size: 28px; font-weight: 600; line-height: 1.22; letter-spacing: -0.02em; color: {{a.ink}}">{{a.title}}</div>
</sc-if>
<span style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: #ffffff; border-radius: 999px; font-size: 12px; font-weight: 600; color: #111111">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{a.dot}}"></span>{{a.kind}}</span>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{a.svc}}" as="s" hint-placeholder-count="2">
<span style="padding: 4px 10px; border: 1px solid #D9D6CC; border-radius: 999px; font-size: 12px; color: #3D3D3B">{{s}}</span>
</sc-for>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"shortForms":{"editor":"enum","options":["condense","hide"],"default":"condense"},"$preview":{"width":1280,"height":1480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 0 };
  }
  renderVals() {
    const F = {
      case: { name: "Case study", dot: "#111111", tint: "#22221B", ink: "#D8D4C6", ph: "[Case study image]" },
      spark: { name: "Spark", dot: "#C6841E", tint: "#F7ECD3", ink: "#7A4D0E", ph: "[Photo]" },
      thread: { name: "Thread", dot: "#2F7A57", tint: "#E1EEE7", ink: "#1A4D33", ph: "[Cover image]" },
      whatif: { name: "What if", dot: "#2A50F3", tint: "#EBF0FE", ink: "#1535A8", ph: "[Cover image]" },
      longread: { name: "Long read", dot: "#6B3EC2", tint: "#EDE6F8", ink: "#4A2A8A", ph: "[Cover image]" }
    };
    const MAIN = [
      { k: "case", title: "[Case study title]", who: "[Client A]", svc: ["Strategy", "Brand"], cover: true },
      { k: "longread", title: "The quiet economics of care work", who: "Scott", svc: ["Strategy"], cover: true },
      { k: "whatif", title: "What if brand was a verb, not a noun?", who: "Grace", svc: ["Brand"], cover: true },
      { k: "case", title: "[Case study title]", who: "[Client B]", svc: ["Digital"], cover: true },
      { k: "longread", title: "Why we stopped pitching against agencies", who: "Scott", svc: ["Strategy"], cover: true },
      { k: "case", title: "[Case study title]", who: "[Client C]", svc: ["Labs", "Strategy"], cover: true },
      { k: "whatif", title: "What if we designed for rest?", who: "Grace", svc: ["Labs"], cover: true }
    ];
    const SHORT = [
      { k: "thread", title: "Three things clients keep asking that they don't need", who: "Zara", svc: ["Strategy"], cover: false },
      { k: "spark", title: "Spent an hour just watching how people cross the street here. It's a language.", who: "Zara", svc: ["Digital"], cover: false },
      { k: "thread", title: "Notes from a week of no meetings", who: "Scott", svc: ["Labs"], cover: false }
    ];
    const condense = (this.props.shortForms ?? "condense") === "condense";
    const all = condense ? MAIN.concat(SHORT) : MAIN;
    const active = Math.min(this.state.active, all.length - 1);
    const mk = (e, i) => {
      const on = i === active;
      return {
        ...e,
        kind: F[e.k].name,
        dot: F[e.k].dot,
        svcText: e.svc.join(", "),
        color: on ? "#111111" : "#6B6B67",
        indent: on ? 16 : 0,
        arrow: on ? 1 : 0,
        hover: () => this.setState({ active: i })
      };
    };
    const rows = MAIN.map((e, i) => mk(e, i));
    const shorts = SHORT.map((e, i) => mk(e, i + MAIN.length));
    const e = all[active];
    const a = {
      ...e,
      kind: F[e.k].name,
      dot: e.k === "case" ? "#ffffff" : F[e.k].dot,
      tint: F[e.k].tint,
      ink: F[e.k].ink,
      placeholder: F[e.k].ph,
      quote: !e.cover
    };
    return { rows, shorts, a, condense };
  }
}
</script>
</body>
</html>
