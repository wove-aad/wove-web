<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Wove Mind: mosaic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script>

const app = document.getElementById("app");
const open = {}; let radius = 16;
const ORDER = [2, 0, 1, 3, 4, 5, 6];
function tile(e, i) {
  const r = `border-radius:${radius}px`;
  if (e.k === "longread") return `<a href="#" class="tile" style="grid-column:span 8;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));${r};background:#EDE6F8;min-height:420px">
<div style="position:relative;overflow:hidden"><div class="ph mi" style="background:#D9CCF0;color:#4A2A8A">[Cover image]</div></div>
<div style="padding:32px;display:flex;flex-direction:column;gap:16px"><span class="label" style="color:#4A2A8A"><span class="dot" style="background:#6B3EC2"></span>Long read · ${e.meta}</span>
<h3 style="margin:0;font-size:34px;font-weight:800;line-height:1.08;letter-spacing:-.03em">${e.title}</h3>
<p style="margin:0;font-size:16px;line-height:1.5;color:#3D3D3B">[Deck: one sentence that draws the reader in]</p><div style="flex-grow:1"></div>
<div class="meta" style="color:#3D3D3B"><span class="av" style="background:#fff;color:#4A2A8A;width:28px;height:28px">${e.ini}</span><b style="font-weight:600">${e.author}</b><span style="margin-left:auto;color:#4A2A8A">${e.tags.join("  ")}</span></div>
<span style="display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:5px">Read the piece ${ARROW(16)}</span></div></a>`;
  if (e.k === "whatif") return `<article class="tile" style="grid-column:span 4;padding:28px;${r};background:#EBF0FE;display:flex;flex-direction:column;gap:18px;min-height:420px">
<span class="label" style="color:#1535A8"><span class="dot" style="background:#2A50F3"></span>What if · ${e.meta}</span>
<h3 style="margin:0;font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.03em;color:#1535A8">${e.title}</h3><div style="flex-grow:1"></div>
${open[i] ? `<div class="struct"><div><b>Premise</b><span>[Premise]</span></div><div><b>Tension</b><span>[Tension]</span></div><div><b>Question</b><span>[Question]</span></div></div>` : ""}
<div style="display:flex;align-items:center;gap:10px"><span class="av" style="background:#fff;color:#1535A8;width:28px;height:28px">${e.ini}</span><span style="font-size:13px;font-weight:600;color:#3D3D3B">${e.author}</span><button class="toggle" data-t="${i}" aria-expanded="${!!open[i]}">${open[i] ? "Close" : "Unpack it"}</button></div></article>`;
  if (e.k === "spark" && e.photo) return `<a href="#" class="tile" style="grid-column:span 4;${r};background:#111;display:flex;flex-direction:column;min-height:340px">
<div style="position:absolute;inset:0;overflow:hidden"><div class="ph mi" style="background:#3A2E17;color:#F7ECD3">[Photo]</div></div>
<div style="position:relative;margin-top:auto;padding:24px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(to top,rgba(17,17,17,.85),rgba(17,17,17,0))"><span class="label" style="color:#F7ECD3"><span class="dot" style="background:#C6841E"></span>Spark</span><p style="margin:0;font-size:18px;font-weight:600;line-height:1.3;color:#fff">${e.title}</p><span style="font-size:13px;color:#EAEAE4">${e.author}</span></div></a>`;
  if (e.k === "spark") return `<a href="#" class="tile" style="grid-column:span 4;padding:28px;${r};background:#F7ECD3;display:flex;flex-direction:column;gap:20px;min-height:340px">
<span class="label" style="color:#7A4D0E"><span class="dot" style="background:#C6841E"></span>Spark</span><p style="margin:0;font-size:26px;font-weight:600;line-height:1.25;letter-spacing:-.02em;color:#3A2608">${e.title}</p><div style="flex-grow:1"></div>
<div class="meta" style="color:#7A4D0E"><span class="av" style="background:#fff;width:28px;height:28px">${e.ini}</span><b style="font-weight:600">${e.author}</b><span style="margin-left:auto">${e.tags.join("  ")}</span></div></a>`;
  return `<a href="#" class="tile" style="grid-column:span 4;padding:28px;${r};background:#fff;border:1px solid #D9D6CC;display:flex;flex-direction:column;gap:16px;min-height:340px">
<span class="label" style="color:#1A4D33"><span class="dot" style="background:#2F7A57"></span>Thread · ${e.meta}</span><h3 style="margin:0;font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.02em">${e.title}</h3>
<p style="margin:0;font-size:15px;line-height:1.55;color:#6B6B67">[Opening lines of the thread]</p><div style="flex-grow:1"></div>
<div class="meta" style="color:#3D3D3B"><span class="av" style="background:#E1EEE7;color:#1A4D33;width:28px;height:28px">${e.ini}</span><b style="font-weight:600">${e.author}</b><span style="margin-left:auto;color:#6B6B67">${e.tags.join("  ")}</span></div></a>`;
}
function render() {
  const legend = `<div style="display:flex;gap:16px;font-size:13px;color:#3D3D3B">${["spark", "thread", "whatif", "longread"].map((k) => `<span style="display:inline-flex;align-items:center;gap:6px"><span class="dot" style="background:${F[k].dot}"></span>${F[k].name}</span>`).join("")}</div>`;
  app.innerHTML = bar("B · Wove Mind: mosaic sized by format", `<label>Corner radius <input type="range" min="0" max="32" step="2" value="${radius}" data-r></label>`) +
    `<main class="page" style="gap:48px">${mindHead(legend)}<div class="grid12">${ORDER.map((i) => tile(ENTRIES[i], i)).join("")}</div></main>`;
}
app.addEventListener("click", (ev) => { const t = ev.target.closest("[data-t]"); if (t) { open[t.dataset.t] = !open[t.dataset.t]; render(); } if (ev.target.closest("a[href=\"#\"]")) ev.preventDefault(); });
app.addEventListener("change", (ev) => { if (ev.target.matches("[data-r]")) { radius = +ev.target.value; render(); } });
render();
</script>
</body>
</html>
