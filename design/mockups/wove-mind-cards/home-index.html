<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Homepage: index</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script>

const app = document.getElementById("app");
let short = "condense", active = 0;
function preview(e) {
  const f = F[e.k];
  const cover = e.k === "case" || e.k === "longread" || e.k === "whatif";
  return `<div class="pv" style="background:${f.tint}">${cover ? `<div class="ph" style="color:${f.ink}">[${e.k === "case" ? "Case study image" : "Cover image"}]</div>` : `<div class="quote" style="padding:36px;font-size:28px;color:${f.ink}">${e.title}</div>`}<span class="pill" style="top:20px;left:20px"><span class="dot" style="background:${e.k === "case" ? "#fff" : f.dot};${e.k === "case" ? "box-shadow:inset 0 0 0 1px #111" : ""}"></span>${f.name}</span></div>
<div style="display:flex;gap:6px;flex-wrap:wrap">${e.svc.map((s) => `<span class="svc">${s}</span>`).join("")}</div>`;
}
function render() {
  const all = short === "condense" ? HOME_MAIN.concat(HOME_SHORT) : HOME_MAIN;
  if (active >= all.length) active = 0;
  const rows = HOME_MAIN.map((e, i) => `<a href="#" class="row${i === active ? " on" : ""}" data-i="${i}"><div style="display:flex;flex-direction:column;gap:8px;flex-grow:1;min-width:0"><span class="rm"><span class="dot" style="background:${F[e.k].dot}"></span>${F[e.k].name} · ${e.who} · ${e.svc.join(", ")}</span><span class="rt">${e.title}</span></div><span class="arrow">${ARROW(28)}</span></a>`).join("");
  const shorts = short === "condense" ? `<div style="display:flex;flex-direction:column;padding-top:40px"><span class="eyebrow" style="letter-spacing:.08em;padding-bottom:12px">Short thoughts</span>${HOME_SHORT.map((e, j) => { const i = j + HOME_MAIN.length; return `<a href="#" class="row small${i === active ? " on" : ""}" data-i="${i}"><span class="rm" style="width:96px;flex-shrink:0"><span class="dot" style="background:${F[e.k].dot}"></span>${F[e.k].name}</span><span class="rt">${e.title}</span><span style="flex-shrink:0;font-size:13px;color:#6B6B67">${e.who}</span></a>`; }).join("")}</div>` : "";
  app.innerHTML = bar("C · Homepage: index with preview", shortFormsControl(short)) + `<main class="page" style="gap:48px">${homeHead()}<div class="split"><div><div style="border-bottom:1px solid #EAEAE4">${rows}</div>${shorts}</div><aside class="preview" aria-label="Preview" id="pv">${preview(all[active])}</aside></div></main>`;
  app.querySelectorAll(".row").forEach((r) => { const go = () => activate(+r.dataset.i); r.addEventListener("mouseenter", go); r.addEventListener("focus", go); r.addEventListener("click", (ev) => ev.preventDefault()); });
}
function activate(i) { if (i === active) return; active = i; const all = HOME_MAIN.concat(HOME_SHORT); app.querySelectorAll(".row").forEach((r) => r.classList.toggle("on", +r.dataset.i === i)); document.getElementById("pv").innerHTML = preview(all[i]); }
app.addEventListener("change", (ev) => { if (ev.target.matches("[data-short]")) { short = ev.target.value; render(); } });
render();
</script>
</body>
</html>
