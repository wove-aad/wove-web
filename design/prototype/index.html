<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wove Homepage</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/feed.css">
<link rel="stylesheet" href="css/prototype.css">
</head>
<body class="tpl-home">

<a href="#main" class="skip-link">Skip to main content</a>

<header class="hero-bar">
  <div class="hero-bar__inner">
    <a href="index.html" class="hero-bar__logo">Wove Group.</a>
    <h1 class="hero-bar__statement">Shaping a better Ireland through strategic design and technology</h1>
    <a href="#contact" class="btn btn--sm btn--primary hero-bar__cta">Get in touch</a>
  </div>
</header>

<div class="feed-wrap">

  <!-- CONTEXT: what the studio does. Words fade up as it scrolls into view (js/reveal.js). -->
  <section class="home-context" aria-label="What we do">
    <div class="home-context__inner">
      <p class="home-context__text" data-reveal>We help the people running Ireland’s public services, cultural institutions, and mission-led organisations move from strategy to delivery.</p>
    </div>
  </section>

  <!-- CONDENSED FILTER BAR: desktop, pinned while scrolling the feed -->
  <div class="filter-bar" id="filter-bar" aria-label="Filters" role="region" inert></div>

  <main class="feed feed--home" id="main">

    <div class="feed__header" id="feed">
      <h2 class="feed__title">Recent work</h2>
      <span class="feed__showing label" id="feed-count"></span>
    </div>

    <!-- FILTERS: rendered by js/home.js in the selected layout -->
    <div class="filters" id="filters"></div>

    <div class="feed-cards feed-cards--home" id="feed-grid"></div>
    <div class="feed-more" id="feed-more" hidden></div>

  </main>

  <!-- PROCESS BLOCK: to be designed -->
  <section class="process-placeholder" aria-label="Process">
    <div class="process-placeholder__box">Process block (to be designed)</div>
  </section>
</div>

<!-- Prototype only: switch between filter layouts -->
<div class="variant-switcher" id="variant-switcher"></div>

<script src="js/data.js"></script>
<script src="js/home.js"></script>
<script src="js/reveal.js"></script>

</body>
</html>
