<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wove Homepage</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/feed.css">
<link rel="stylesheet" href="css/prototype.css">
</head>
<body class="tpl-home">

<a href="#main" class="skip-link">Skip to main content</a>

<header class="hero-bar">
  <div class="hero-bar__inner">
    <a href="index.html" class="hero-bar__logo">Wove Group.</a>
    <h1 class="hero-bar__statement">Shaping a better Ireland through strategic design and technology</h1>
    <a href="#contact" class="btn btn--sm btn--primary hero-bar__cta">Get in touch</a>
  </div>
</header>

<div class="feed-wrap">
  <main class="feed feed--home" id="main">

    <div class="feed__header" id="feed">
      <h2 class="feed__title">Latest from the studio</h2>
      <span class="feed__showing label" id="feed-count"></span>
    </div>

    <!-- CLIENT CAROUSEL: filters the feed by case study -->
    <section class="client-carousel" aria-label="Filter by client">
      <ul class="client-carousel__track" id="client-track" role="list"></ul>
      <div class="client-carousel__controls">
        <input type="range" class="client-carousel__slider" id="client-slider" min="0" max="1000" value="0" aria-label="Scroll clients">
        <div class="client-carousel__arrows">
          <button type="button" class="client-carousel__arrow" id="client-prev" aria-label="Previous clients">&larr;</button>
          <button type="button" class="client-carousel__arrow" id="client-next" aria-label="Next clients">&rarr;</button>
        </div>
      </div>
    </section>

    <!-- TOPIC PILLS: services and tags, combined with the client filter -->
    <div class="topic-pills" id="topic-pills" aria-label="Filter by topic"></div>

    <!-- CASE STUDY PANEL: shown when a client is selected -->
    <section class="case-panel" id="case-panel" aria-live="polite" hidden></section>

    <div class="feed-cards feed-cards--home" id="feed-grid"></div>

  </main>
</div>

<script src="js/data.js"></script>
<script src="js/home.js"></script>

</body>
</html>
