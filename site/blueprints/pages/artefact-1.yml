      about:
        type: info
        headline: Component preview page
        text: |
          This page renders itself from **page('wove-mind')->children()** —
          Spark, Thread, What if and Long read entries flow in automatically.
          There are no editable fields; add or edit Wove Mind entries to
          change what shows here.

          Six sections: three carousels (sparks / threads / everything mixed)
          and two filterable grids (all formats / threads only). Filter chips
          (tag, case study, service) build themselves from real content.

          Toggle bylines from the header to preview both states.
