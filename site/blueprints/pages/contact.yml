title: Contact

tabs:
  content:
    label: Content
    icon: email

    columns:
      main:
        width: 2/3
        sections:
          content:
            type: fields
            fields:

              headline:
                label: Page Title
                type: text
                default: Get in touch

              intro:
                label: Intro
                type: textarea
                size: small
                default: "Whether you're exploring a project, responding to a tender, or looking for strategic advice — start here."

              enquiry_heading:
                label: "Card 1: Enquiry heading"
                type: text
                default: Discuss a project

              enquiry_desc:
                label: "Card 1: Enquiry description"
                type: textarea
                size: small
                default: Tell us about what you're working on and we'll get back to you.

              tender_heading:
                label: "Card 2: Tender heading"
                type: text
                default: Invite us to tender

              tender_desc:
                label: "Card 2: Tender description"
                type: textarea
                size: small
                default: Share the details of your RFT and we'll confirm receipt within one working day.

              tender_ack:
                label: "Card 2: Acknowledgement copy"
                type: text
                default: "We'll confirm receipt within one working day."

              strategy_heading:
                label: "Card 3: Strategy heading"
                type: text
                default: Book a strategy conversation

              strategy_desc:
                label: "Card 3: Strategy description"
                type: textarea
                size: small
                default: A 30-minute conversation with our strategy lead to explore how we might help.

              strategy_partner:
                label: "Card 3: Named partner"
                type: users
                max: 1
                help: The person shown on the strategy card (e.g. Karl Twomey).

              strategy_partner_intro:
                label: "Card 3: Partner intro"
                type: textarea
                size: small
                default: "Karl works across public sector, cultural institutions, and mission-led organisations. He'll help you figure out whether Wove is the right fit — and if not, point you to someone who is."

              strategy_response:
                label: "Card 3: Response time"
                type: text
                default: "We'll be in touch within 48 hours."

      sidebar:
        width: 1/3
        sections:
          routing:
            type: fields
            headline: Form Routing
            fields:

              enquiry_email:
                label: Enquiry inbox
                type: email
                default: hello@wove.group
                help: Project enquiry form submissions go here.

              tender_email:
                label: Tender inbox
                type: email
                default: tenders@wove.group
                help: Tender invite form submissions go here.

              strategy_email:
                label: Strategy inbox
                type: email
                help: Strategy conversation requests go here (or leave blank to use the partner's email).

  seo: tabs/seo
