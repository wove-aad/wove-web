title: Sector

tabs:
  content:
    label: Content
    icon: grid-top-left

    columns:
      main:
        width: 2/3
        sections:
          content:
            type: fields
            fields:

              headline:
                label: Sector Name
                type: text
                required: true
                help: Displayed as the hero heading on the sector collection page.

              intro:
                label: Intro
                type: textarea
                size: small
                help: Short description shown beneath the sector name.

              sectorKey:
                label: Sector Key
                type: select
                required: true
                options:
                  arts-and-culture: Arts and Culture
                  public-service: Public Service
                  higher-education: Higher Education
                  non-profit: Non-profit and Mission-led
                  founders-ventures: Founders and Ventures
                help: Must match the sector value used on entries and case studies. Used to filter content for this page.

      sidebar:
        width: 1/3
        sections:
          meta:
            type: fields
            headline: Display
            fields:

              heroImage:
                label: Hero Image
                type: files
                max: 1
                query: page.images
                help: Optional hero image for the sector collection page.

              featured:
                label: Featured case studies
                type: pages
                query: kirby.collection('case-studies')
                help: Pin specific case studies to the top of this sector page.

  seo: tabs/seo
