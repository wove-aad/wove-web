title: Wove Mind Entry

tabs:
  content:
    label: Content
    icon: page

    columns:
      main:
        width: 2/3
        sections:
          content:
            type: fields
            fields:

              format:
                label: Format
                type: select
                required: true
                options:
                  spark: Spark
                  thread: Thread
                  whatif: What if
                  longread: Long read

              title:
                label: Title
                type: text
                info: "Not used for Spark — but Kirby's `when` only supports matching a single value, not a list, so this can't be conditionally hidden per format. Shows for every format."

              blocksHeadline:
                type: headline
                label: Body Content

              blocks:
                type: blocks
                help: Main article content displayed below the hero.

              body:
                label: Excerpt / Lead
                type: writer
                info: "Short intro shown below the title in the hero area. Also used as the meta description fallback if the SEO tab is left empty. For Thread / What if / Long read."
                placeholder: Write a short intro or excerpt.
                headings:
                  - 2
                  - 3
                  - 4
                marks:
                  - bold
                  - italic
                  - link
                nodes:
                  - heading
                  - bulletList
                  - orderedList
                  - quote

      sidebar:
        width: 1/3
        sections:

          image_section:
            type: fields
            fields:
              image:
                label: Featured image
                type: files
                max: 1
                info: "Used as the hero image and in structured data. Not used for Spark."

          author_section:
            type: fields
            fields:

              show_author:
                label: Show author
                type: toggle
                default: true

              author:
                label: Author
                type: users
                max: 1
                when:
                  show_author: true

              author_role:
                label: Author role
                type: text
                placeholder: e.g. Strategy Director
                when:
                  show_author: true
                info: Shown in the byline and in structured data for search engines.

              author_bio:
                label: Author bio
                type: textarea
                size: small
                when:
                  show_author: true
                info: Short bio shown at the end of the article.

          display_section:
            type: fields
            fields:

              case_study:
                label: Relate to case study
                type: pages
                query: kirby.collection('case-studies')
                info: Shows on that case study's page

              services:
                label: Relate to service
                type: multiselect
                options:
                  strategy: Strategy
                  labs: Labs
                  digital: Digital
                  brand: Brand
                info: Shows on the selected service page(s)

              sectors:
                label: Sector
                type: multiselect
                options:
                  arts-and-culture: Arts and Culture
                  public-service: Public Service
                  higher-education: Higher Education
                  non-profit: Non-profit and Mission-led
                  founders-ventures: Founders and Ventures
                info: Used for sector filtering on the feed and sector collection pages.

              tags:
                label: Tags
                type: tags
                accept: all
                options:
                  type: query
                  query: site.tags.toStructure.filterBy("active", 'true').sortBy("name", "desc")
                  text: "{{ item.name }}"
                  value: "{{ item.name.slug }}"
                help: These options are managed in the <a href="/panel/site?tab=tabTaxonomies">Global Site Taxonomies tab</a> of the site settings.

              date:
                label: Published on
                type: date
                time: true
                default: now
                help: Used for sorting in listings and shown as the publish date.

  seo: tabs/seo
