title: Wove Mind
icon: cloud

tabs: 
  content:
    label: Wove Mind Entries
    icon: page
    columns:
      left:
        width: 2/3
        sections:

          hero:
            type: fields
            fields:
              headline:
                label: Hero statement
                type: text
                placeholder: Shaping a better Ireland through strategic design and technology
                help: The opening line of the homepage hero, set in bold grey. Leave empty to use the placeholder text.
              intro:
                label: Hero description
                type: textarea
                size: small
                buttons: false
                placeholder: We help the people running Ireland’s public services, cultural institutions and mission-led organisations move from strategy to delivery.
                help: Follows the statement in the same paragraph. Leave empty to use the placeholder text.

          listed:
            extends: sections/wove-mind-entries
            label: Published
            status: listed

      right:
        width: 1/3
        sections:

          image_section:
            type: fields
            fields:
              image:
                label: Featured image
                type: files
                max: 1

          drafts:
            extends: sections/wove-mind-entries
            label: Drafts
            status: draft

          unlisted:
            extends: sections/wove-mind-entries
            label: In Review
            status: unlisted
      #     categories:
      #       extends: sections/categories
      #       label: Blog Categories

  # SEO tab
  seo: tabs/seo
