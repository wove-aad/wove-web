title: Site dashboard

tabs:
  tabContent:
    label: Page Content
    icon: page

    # The layout of this form has two columns:
    columns:
      - width: 2/3
        sections:

          wove-mind-entries:
            extends: sections/wove-mind-entries
            limit: 3
            headline: "☁️ Wove Mind Entries →"
            icon: cloud

          case-studies:
            extends: sections/case-studies
            limit: 3
            headline: "🪄 Case Studies →"

      # The second column
      - width: 1/3
        sections:

          drafts:
            # headline: Draft pages
            type: pages
            status: draft
            create: 
              - default
              - wove-mind
              - work
            #   # - media-gallery
            #   - contact
            #   - employer faq
            #   # - news
            help: Draft pages can only be seen by editors with Panel access.

          general:
            # headline: Published top-level pages
            type: pages
            status: listed
            sortable: true
            help: General top level published pages
            # template: default page
            # layout: cardlets
            image:
              query: page.heroimages.toFile
              ratio: 1/1
              cover: true

          unlisted:
            # headline: Unlisted pages
            type: pages
            status: unlisted
            sortable: true
            help: Unlisted pages are accessible online and can be visited with the direct URL but do not appear in the main site navigation.
            image:
              ratio: 1/1
              cover: true

          # fields:
          #   type: fields
          #   fields:
          #     categories:
          #       type: blocks
          #       pretty: true
          #       fieldsets:
          #         - category

  # Menu Navigation tab            
  # tabNavigation:
  #   label: Site Navigation
  #   icon: menu
  #   extends: tabs/menu-navigation

  # Site Contact info tab            
  tabFooterContact:
    label: Site Contact Info
    icon: phone
    extends: tabs/footer-contact-info

  # Site Taxonomies tab
  tabTaxonomies:
    label: Site Taxonomies
    icon: tag
    extends: tabs/taxonomies
