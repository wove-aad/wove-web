# Taxonomies tab
label: Global Site Taxonomies
icon: tag
fields:
  tags:
    label: Tags
    type: structure
    fields:
      name:
        label: Tag name
        type: text
      slug:
        label: Tag slug
        type: slug
        sync: name
        required: true
        help: Used in the URL and for filtering articles by tag.
      intro:
        label: Tag Intro
        type: text
      subtitle:
        label: Subtitle
        type: text
        help: Optional tagline shown beneath the tag name on the tag destination page.
      meta:
        label: Meta description
        type: textarea
        size: small
        help: Optional SEO/social description for the tag landing page.
      active:
        label: Published
        type: toggle
        text:
          - "No"
          - "Yes"
        default: true
        help: Turn off to hide this tag from the site
