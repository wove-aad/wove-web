title: Mind entry

options:
  changeTemplate: false
  changeSlug: true
  delete: true
  duplicate: true

status:
  draft:
    label: Draft
    text: Only you and admins can see this.
  listed:
    label: Live
    text: Published to the site.

# Fields the editor renders. The Vue shell:
#   - hides `format` from k-form (it's the topbar chip instead)
#   - lifts `cover` to the top of the compose column above the title
#   - splits the remainder into main column vs. settings rail
# See EntryEditorView.vue.
fields:

  # ── Post type — hidden from k-form; presented as a topbar chip ─
  format:
    label: Format
    type: select
    default: whatif
    required: true
    options:
      spark: Spark
      thread: Thread
      whatif: What if
      longread: Long read

  # ── Compose column — cover first (magazine style) ─────────────
  cover:
    label: Cover image
    type: files
    layout: cards
    max: 1
    query: page.images
    uploads: cover
    when:
      format: [thread, whatif, longread]
    help: Shown in the feed and at the top of the post.

  title:
    label: Title
    type: text
    required: true
    when:
      format: [thread, whatif, longread]

  deck:
    label: Deck
    type: text
    when:
      format: longread
    help: One sentence that draws the reader in.

  # ── Body variants ────────────────────────────────────────────
  # Spark / Thread / Long read: single writer field.
  body:
    label: Body
    type: writer
    marks: [bold, italic, link, code]
    nodes: [heading, bulletList, orderedList, quote]
    when:
      format: [spark, thread, longread]

  # What if: three scaffolded fields that teach the format.
  premise:
    label: The premise
    type: writer
    marks: [bold, italic, link]
    when:
      format: whatif
    help: What's the starting assumption you want to poke at?

  tension:
    label: The tension
    type: writer
    marks: [bold, italic, link]
    when:
      format: whatif
    help: Where does that assumption start to break down?

  question:
    label: The question
    type: writer
    marks: [bold, italic, link]
    when:
      format: whatif
    help: What do you want the reader chewing on?

  # ── Settings rail ─────────────────────────────────────────────
  tags:
    label: Tags
    type: tags
    accept: options
    separator: ","
    options:
      type: query
      query: site.find('mind').children.pluck('tags', ',', true)

  showByline:
    label: Show byline
    type: toggle
    default: true
    text: Author name is visible on the post

  service:
    label: Relate to a service
    type: multiselect
    options:
      strategy: Strategy
      labs: Labs
      digital: Digital
      brand: Brand
    help: Also surfaces the post on that service's page.

  caseStudy:
    label: Relate to a case study
    type: text
    help: Slug of the case study (placeholder — will become a pages picker once case studies exist).

  metaTitle:
    label: Meta title
    type: text
    help: Defaults to the post title if empty.

  metaDescription:
    label: Meta description
    type: textarea
    size: small
    maxlength: 160
    counter: true
    help: Recommended for long reads.
