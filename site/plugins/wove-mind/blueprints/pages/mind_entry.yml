title: Mind entry

options:
  changeTemplate: false
  changeSlug: true
  delete: true
  duplicate: true

status:
  draft:
    label: Draft
    text: Only you and admins can see this.
  listed:
    label: Live
    text: Published to the site.

# Fields are all defined here without `when:` conditions. The Vue
# editor shell decides which fields render in the compose column
# based on `values.format`, because Kirby's `when:` only supports
# scalar matches (not arrays like [spark, thread, longread]).
# See EntryEditorView.vue → mainFieldsForFormat().
fields:

  # Type — driven by the topbar chip, never rendered via k-form.
  format:
    label: Format
    type: select
    default: whatif
    required: true
    options:
      spark: Spark
      thread: Thread
      whatif: What if
      longread: Long read

  # Compose column — cover first (magazine style), then title/deck/body.
  cover:
    label: Cover image
    type: files
    layout: cards
    max: 1
    query: page.images
    uploads: true
    help: Shown in the feed and at the top of the post.

  title:
    label: Title
    type: text
    required: false

  deck:
    label: Deck
    type: text
    help: One sentence that draws the reader in.

  # Spark / Thread use `body` — a light writer field.
  body:
    label: Body
    type: writer
    marks: [bold, italic, link, code]
    nodes: [heading, bulletList, orderedList, quote]

  # Long read uses `content` — a blocks editor so authors can mix
  # paragraphs, headings, images, quotes, code, video inline as they
  # write. Requires the standard page-view scaffolding (versions /
  # lock / permissions) which we now pass through.
  content:
    label: Content
    type: blocks
    fieldsets:
      - text
      - heading
      - image
      - quote
      - list
      - code
      - video
      - markdown
      - line

  # What if uses three scaffolded writer fields instead of `body`.
  premise:
    label: The premise
    type: writer
    marks: [bold, italic, link]
    help: What's the starting assumption you want to poke at?

  tension:
    label: The tension
    type: writer
    marks: [bold, italic, link]
    help: Where does that assumption start to break down?

  question:
    label: The question
    type: writer
    marks: [bold, italic, link]
    help: What do you want the reader chewing on?

  # Settings rail.
  tags:
    label: Tags
    type: tags

  showByline:
    label: Show byline
    type: toggle
    default: true
    text: Author name is visible on the post

  service:
    label: Relate to a service
    type: multiselect
    options:
      strategy: Strategy
      labs: Labs
      digital: Digital
      brand: Brand
    help: Also surfaces the post on that service's page.

  caseStudy:
    label: Relate to a case study
    type: pages
    max: 1
    query: site.index.filterBy('intendedTemplate', 'in', ['case-study', 'case_study'])
    empty: No case studies to pick from yet.
    help: Also surfaces the post on that case study's page.

  metaTitle:
    label: Meta title
    type: text
    help: Defaults to the post title if empty.

  metaDescription:
    label: Meta description
    type: textarea
    size: small
    maxlength: 160
    counter: true
    help: Recommended for long reads.
